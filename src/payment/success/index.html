<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/public/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/public/favicon.svg" />
  <link rel="shortcut icon" type="image/x-icon" href="/public/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/public/apple-touch-icon.png" />
  <link href="https://cdn.jsdelivr.net/npm/remixicon@2.5.0/fonts/remixicon.css" rel="stylesheet" />
  <link rel="stylesheet" href="../../styles.css" />
  <link rel="stylesheet" href="styles.css" />
  <title>Pago exitoso | Familia Zaragoza</title>
</head>

<body>
  <header class="header" id="header">
    <div class="header-inner container">
      <a href="/" class="nav_logo">
        <img class="logo_img" src="/public/img/favicon.png" alt="Familia Zaragoza Yerba Mate">
        Familia Zaragoza
      </a>
    </div>
  </header>

  <main class="main">
    <section class="section success-page">
      <div class="container success-container">
        <div class="whatsapp-modal success-card">
          <div class="success-icon">
            <i class="ri-checkbox-circle-line"></i>
          </div>
          <h1 class="section_title success_title">
            Pago exitoso
          </h1>
          <p class="whatsapp-modal-description section_description success-description">
            ¡Gracias por tu compra! Hemos recibido el pago correctamente y te contactaremos pronto para coordinar el envío.
          </p>
          <div class="whatsapp-modal-actions success-actions">
            <a href="/" class="button">
              <i class="ri-arrow-left-line"></i>
              Volver al inicio
            </a>
          </div>
        </div>
      </div>
    </section>
  </main>
</body>

</html>
